name: pages

# `#1297`：把本仓（books）的故事**用引擎编译**，产物发到本仓 Pages ⇒ `https://sagitrs.github.io/sgstory-books/` 可直接玩。
# 触发：push 到 main（内容一变就重发）＋ workflow_dispatch（手动补跑取证）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只发一次（后到的等前一次发完；不取消在发的 —— 取消会留下半发布）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: books
          fetch-depth: 0        # `#1297` §四4b：要能 `git show` 本笔的件面

      # ── §一 钉 ref：**40-hex 硬格 ＋ 同处写 why**；解析不到 ⇒ **本步就红**（fail-loud，不拖到 build 阶段）──
      # 归因类 (a) engine-ref
      - name: 读引擎钉 ref（§一；归因 (a)）
        id: pin
        working-directory: books
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(a) engine-ref — $*"; exit 1; }
          [ -f .github/engine-ref.json ] || fail "声明件缺失：.github/engine-ref.json"
          ref=$(jq -r '.ref // empty' .github/engine-ref.json)
          [ -n "$ref" ] || fail "声明件里读不到 ref"
          case "$ref" in
            ????????????????????????????????????????) ;;
            *) fail "钉的 ref 不是完整 sha（40 位十六进制）：$ref" ;;
          esac
          case "$ref" in *[!0-9a-f]*) fail "钉的 ref 含非十六进制字符：$ref" ;; esac
          why=$(jq -r '.why // empty' .github/engine-ref.json)
          [ -n "$why" ] || fail "声明件里读不到 why（钉法必须写明理由）"
          echo "引擎 ref = $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # §四4b：**bump 那一笔件面只含声明件** —— 本笔改了声明件 ⇒ 它的件面必须 ⊆ 声明件（不许夹带故事面）
      - name: §四4b 核 bump 笔未夹带故事面（归因 (a)）
        if: github.event_name == 'push'
        working-directory: books
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(a) engine-ref — $*"; exit 1; }
          sha="${{ github.sha }}"
          if git diff-tree --no-commit-id --name-only -r "$sha" | grep -qx '.github/engine-ref.json'; then
            files=$(git diff-tree --no-commit-id --name-only -r "$sha")
            echo "本笔件面："; echo "$files"
            # `#1304` 口径收窄：4b 的本意是「**不许借 bump 夹带故事行为改动**」——
            # 故判据从"件面只含声明件"改为"件面**不得含 `stories/**` 或 `cases/**`**"。
            # 为什么必须改（实况）：bump 那笔常把「本地复算前先清生成物」这类**说明面**（README）一并带上，
            # 而它正是这条链的前置步骤、与 bump 同笔**合理**；原判据会把"修 pin 的那次发布"挡在门外 ✗
            # （实测：books `#5` 合入后发布 run 35992248367 **failure**，失败步就是本步 ⇒ 线上仍是老引擎）。
            # ★ "不许夹带故事面"这一格**保留**（bump 顺手改进故事行为 ⇒ 必须红）。
            bad=$(printf '%s\n' "$files" | grep -E '^(stories/|cases/)' || true)
            [ -z "$bad" ] || fail "bump 引擎 ref 的那一笔**夹带了故事面改动**（不得含 stories/** 或 cases/**）：$bad"
            echo "✓ bump 笔未夹带故事面（说明面如 README／docs 允许同笔）"
          else
            echo "本笔未改声明件 ⇒ §四4b 不适用"
          fi

      - uses: actions/checkout@v4
        with:
          repository: sagitrs/sgstory
          ref: ${{ steps.pin.outputs.ref }}
          path: engine
          fetch-depth: 0

      # §一：★ **"不可用"与"陈旧"分开** ——
      #   · 钉的 sha **非 main 的祖先**（＝钉了"在飞的东西"）⇒ **红**（§四4a）
      #   · 是祖先但**落后** main ⇒ **告警不阻断**（附落后笔数）
      - name: §一/§四4a 核钉的提交（归因 (a)）
        working-directory: engine
        run: |
          set -euo pipefail
          ref="${{ steps.pin.outputs.ref }}"
          if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then
            echo "::error title=pd-attribution::(a) engine-ref — 钉的 sha 在引擎仓里**取不到**：$ref"; exit 1
          fi
          git fetch -q origin main || true
          if ! git merge-base --is-ancestor "$ref" origin/main 2>/dev/null; then
            echo "::error title=pd-attribution::(a) engine-ref — 钉的 sha **不是引擎 main 的祖先**（钉了未合入的\"在飞\"提交）：$ref"; exit 1
          fi
          behind=$(git rev-list --count "$ref..origin/main")
          echo "落后引擎 main 笔数 = $behind"
          if [ "$behind" -gt 0 ]; then
            echo "::warning title=pd-stale-ref::钉的引擎 ref 落后 main $behind 笔（不阻断：可用但陈旧；升级＝改声明件一行）"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: 装引擎依赖
        working-directory: engine
        run: npm ci

      # 字体子集化依赖：引擎自己的 4 个工作流都装了（`ci.yml:62` 等）⇒ 本仓发布**同款**。
      # 不装 ⇒ `build.mjs` 走"优雅回退"（系统字体）⇒ **发布页静默缺字体面**（实测线上少 4 段／686 B）。
      - name: 装字体子集化依赖（fonttools／brotli）
        run: pip install fonttools brotli

      - name: 编译故事（产物随故事根 ⇒ 落 books/dist；归因 (b)）
        working-directory: engine
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(b) story-face — $*"; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/books/dist"
          SG_STORIES_DIR="$GITHUB_WORKSPACE/books/stories" node build.mjs || fail "引擎编译失败（build.mjs 非零退出）"
          [ -f "$GITHUB_WORKSPACE/books/dist/index.html" ] || fail "未生成 dist/index.html（产物落点不对？）"

      # §五 冒烟**条件化**：有故事 ⇒ 缺链接必红；零故事 ⇒ **显式分叉 ＋ 软通过**（不许恒红 —— `post-deploy-smoke` 的教训）
      # §六 引擎仓**脏 0** ＋ `stories/**` 0 —— 能假：**故意不设 `SG_STORIES_DIR`** ⇒ 产物落进引擎仓 ⇒ 本步红
      - name: §五/§六 断言产物可用 ＋ 引擎仓没被写脏（归因 (b)）
        working-directory: books
        run: |
          set -euo pipefail
          # ★ 计数空集合的**安全写法**：`ls` 对空 glob 返回 2 ⇒ `2>/dev/null` 只藏报文、藏不住退出码 ⇒
          #   `set -e`＋`pipefail` 会**把通过态当失败杀掉**（books 首跑实测 exit 2）⇒ 一律 `|| true` 包住。
          storyN=$( (ls -d stories/*/ 2>/dev/null || true) | wc -l | tr -d ' ')
          echo "故事数 = $storyN"
          if [ "$storyN" -eq 0 ]; then
            echo "::notice title=pd-smoke::零故事态 ⇒ 书架页无链接属预期，**软通过**（显式分叉，非恒红）"
          else
            n=$(grep -c 'stories/' dist/index.html || true)
            echo "书架页 stories/ 链接数 = $n"
            if [ "$n" -lt 1 ]; then
              echo "::error title=pd-attribution::(b) story-face — 有 $storyN 个故事，但书架页 0 个 stories/ 链接"; exit 1
            fi
            nPages=$( (ls dist/stories/*/index.html 2>/dev/null || true) | wc -l | tr -d ' ')
            [ "$nPages" -ge 1 ] || { echo "::error title=pd-attribution::(b) story-face — 无任何故事页产物"; exit 1; }
          fi
          # §六：引擎仓必须干净（发布只读引擎仓）
          dirty=$(git -C "$GITHUB_WORKSPACE/engine" status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error title=pd-attribution::(b) story-face — 引擎仓被写脏（发布应只读）："; echo "$dirty"; exit 1
          fi
          # 同款安全写法（本行是首跑 exit 2 的真因：引擎仓 `stories/` 本来就空 ⇒ 空 glob ⇒ `ls` 退出 2）。
          inside=$( (ls -d "$GITHUB_WORKSPACE/engine/stories"/*/ 2>/dev/null || true) | wc -l | tr -d ' ')
          if [ "$inside" != "0" ]; then
            echo "::error title=pd-attribution::(b) story-face — 引擎仓里出现了 stories/<slug>（未设 SG_STORIES_DIR？）"; exit 1
          fi
          echo "✓ 引擎仓脏 0；✓ 引擎仓 stories/** 0"

          # ── 字体面（归因 (b) story-face）──
          # 引擎侧把字体当**一等交付物**（其 `ci.yml` 有「字体 404（mis-deploy）⇒ 红」）⇒ 本仓发布**同步该口径**。
          # 为什么必须显式断言：`build.mjs` 在缺 fonttools 时**优雅回退系统字体**且只 warn ⇒ 该步仍 success
          # ⇒ **发布判据看不见"线上缺字体面"**（实测：线上故事页少 `font-face`／`woff2` preload 共 4 段 ≈ 686 B）。
          nw=$( (ls dist/fonts/*.woff2 2>/dev/null || true) | wc -l | tr -d ' ')
          echo "dist/fonts/*.woff2 = $nw 个"
          if [ "$nw" -lt 2 ]; then
            echo "::error title=pd-attribution::(b) story-face — 字体产物缺失（dist/fonts/*.woff2 只有 $nw 个，应 2 个：Regular／Medium）⇒ 核 pip install fonttools brotli 与 vendor/fonts/*.ttf"
            exit 1
          fi
          # 口径：**每个**故事页都应带 font-face ⇒ 数"带该标记的页数"，缺页则红。
          # （不用 `grep -c` 求和：单文件时它不输出 `文件:数` 形态 ⇒ `awk -F:` 会恒得 0 ＝**必红假阳**）
          nf=$( (grep -l 'id="font-face"' dist/stories/*/index.html 2>/dev/null || true) | wc -l | tr -d ' ')
          nsp=$( (ls -d dist/stories/*/ 2>/dev/null || true) | wc -l | tr -d ' ')
          echo "故事页带 font-face = $nf / $nsp"
          if [ "$nf" -lt "$nsp" ]; then
            echo "::error title=pd-attribution::(b) story-face — 有故事页缺 font-face（$nf/$nsp 页带该标记）⇒ 发布出去那些页会静默用系统字体"
            exit 1
          fi
          echo "✓ 字体面在场（2 个 woff2 ＋ 故事页 font-face）"
          # 本仓不提交产物
          if git status --porcelain | grep -qE '^\?\? .*(dist/|build/)'; then
            echo "::error title=pd-attribution::(b) story-face — 有未忽略的产物（dist/build）⇒ 补 .gitignore"; exit 1
          fi
          echo "✓ 本仓无未忽略产物"

      # 归因类 (c) Pages 配置：启用失败 ⇒ 点名叫 (c)
      - name: Pages 配置（§三；归因 (c)）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: books/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
