name: pages

# `#1297`：把本仓（books）的故事**用引擎编译**，产物发到本仓 Pages ⇒ `https://sagitrs.github.io/sgstory-books/` 可直接玩。
# 触发：push 到 main（内容一变就重发）＋ workflow_dispatch（手动补跑取证）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只发一次（后到的等前一次发完；不取消在发的 —— 取消会留下半发布）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: books
          fetch-depth: 0        # `#1297` §四4b：要能 `git show` 本笔的件面

      # ── §一 钉 ref：**40-hex 硬格 ＋ 同处写 why**；解析不到 ⇒ **本步就红**（fail-loud，不拖到 build 阶段）──
      # 归因类 (a) engine-ref
      - name: 读引擎钉 ref（§一；归因 (a)）
        id: pin
        working-directory: books
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(a) engine-ref — $*"; exit 1; }
          [ -f .github/engine-ref.json ] || fail "声明件缺失：.github/engine-ref.json"
          ref=$(jq -r '.ref // empty' .github/engine-ref.json)
          [ -n "$ref" ] || fail "声明件里读不到 ref"
          case "$ref" in
            ????????????????????????????????????????) ;;
            *) fail "钉的 ref 不是完整 sha（40 位十六进制）：$ref" ;;
          esac
          case "$ref" in *[!0-9a-f]*) fail "钉的 ref 含非十六进制字符：$ref" ;; esac
          why=$(jq -r '.why // empty' .github/engine-ref.json)
          [ -n "$why" ] || fail "声明件里读不到 why（钉法必须写明理由）"
          # `branch` 也取自声明件（唯一权威）—— 工作流**不硬写**分支名（否则声明件与工作流两份真源）
          br=$(jq -r '.branch // empty' .github/engine-ref.json)
          [ -n "$br" ] || fail "声明件里读不到 branch（"祖先/陈旧"那一格要拿它当基线）"
          echo "引擎 ref = $ref（声明件 branch = $br）"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "branch=$br" >> "$GITHUB_OUTPUT"

      # §四4b：**升钉那一笔不许夹带故事行为改动** —— ★按「**笔的类型**」收窄（`sgstory-books#49` · 链路裁定「甲案」）
      #   ＋ ★按「**push 内的每一笔**」判（`sgstory-books#51`：旧形只读 `github.sha` 单笔 ⇒ **多笔 push 时父笔夹带可逃** ✗）。
      #   ★口径：① **升钉笔**（主题 chore／build／ci／style 型 ⇒ 以“升钉”为名）⇒ 件面**不得**含
      #     `stories/**`／`cases/**`（原意保留 ✓）；② **故事笔**（`feat`／`fix`／`perf`／`refactor`／`test`／`docs` 等
      #     “有内容”的类型）顺手升钉 ⇒ ★走 **PR CI**（`pr-gate` 已跑 `build` ＋ `case-run` 逐 slug）⇒ 本格不适用 ✓；
      #     ③ 说明面（README／docs）与升钉同笔**仍允许**（`#1304` 原意保留 ✓）。
      #   ★两个坑（`#51` 实测在案 ⇒ 显式处置，勿删）：
      #     · `github.event.before` 在**分支新建／强推**时是**全零**或取不到 ⇒ ★退化为“只判 tip 单笔”（有意保留）；
      #     · **合并提交**在 `git diff-tree -r` 下**不列件**（需 `-m`）⇒ ★对合并提交取“**相对第一父**”的件面
      #       （＝该合并**带进主干**的那一份）；✗ 不静默跳过（否则“合并时顺手改故事”可逃）。
      #   ★前提（本格**无法**自证，须靠平台面）：故事面的行为改动**只经 PR** ⇒ main 由 **branch protection 禁直推**
      #     （`sgstory-books#51` ② 已提请 Admin）✓
      - name: §四4b 核升钉笔未夹带故事面（归因 (a)；按笔的类型 ＋ push 内逐笔）
        if: github.event_name == 'push'
        working-directory: books
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(a) engine-ref — $*"; exit 1; }
          sha="${{ github.sha }}"
          # 该笔的件面：**合并提交**取“相对第一父”的那一份（-m --first-parent）；普通提交走常形。
          face_of() {
            if [ "$(git rev-list --parents -n 1 "$1" | wc -w)" -gt 2 ]; then
              git diff-tree -r -m --first-parent --no-commit-id --name-only "$1"
            else
              git diff-tree --no-commit-id --name-only -r "$1"
            fi
          }
          touched=0
          judge_one() {
            local files subject bad
            files=$(face_of "$1")
            printf '%s\n' "$files" | grep -qx '.github/engine-ref.json' || return 0
            touched=1
            subject=$(git log -1 --format=%s "$1")
            echo "  笔 $(git rev-parse --short "$1")｜主题：$subject"
            case "$subject" in
              chore*|build*|ci*|style*)
                bad=$(printf '%s\n' "$files" | grep -E '^(stories/|cases/)' || true)
                [ -z "$bad" ] || fail "升钉笔（$(git rev-parse --short "$1")，主题「$subject」）**夹带了故事面改动**（不得含 stories/** 或 cases/**）：$bad"
                echo "    ✓ 升钉笔未夹带故事面（说明面如 README／docs 允许同笔）" ;;
              *)
                echo "    ✓ 故事笔同笔升钉 ⇒ 走 PR CI（pr-gate：build ＋ case-run 逐 slug）；本格不适用" ;;
            esac
          }
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "★ before 不可用（分支新建／强推／本地取不到）⇒ 退化为**只判 tip 单笔**"
            judge_one "$sha"
          else
            echo "本次 push 范围：$before .. $sha（逐笔判）"
            for c in $(git rev-list "$before..$sha"); do judge_one "$c"; done
          fi
          [ "$touched" -eq 1 ] || echo "范围内没有改声明件的笔 ⇒ §四4b 不适用"

      - uses: actions/checkout@v4
        with:
          repository: sagitrs/sgstory
          ref: ${{ steps.pin.outputs.ref }}
          path: engine
          fetch-depth: 0

      # §一：★ **"不可用"与"陈旧"分开** ——
      #   · 钉的 sha **非 main 的祖先**（＝钉了"在飞的东西"）⇒ **红**（§四4a）
      #   · 是祖先但**落后** main ⇒ **告警不阻断**（附落后笔数）
      - name: §一/§四4a 核钉的提交（归因 (a)）
        working-directory: engine
        run: |
          set -euo pipefail
          ref="${{ steps.pin.outputs.ref }}"
          if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then
            echo "::error title=pd-attribution::(a) engine-ref — 钉的 sha 在引擎仓里**取不到**：$ref"; exit 1
          fi
          base="origin/${{ steps.pin.outputs.branch }}"
          git fetch -q origin "${{ steps.pin.outputs.branch }}" || true
          if ! git merge-base --is-ancestor "$ref" "$base" 2>/dev/null; then
            echo "::error title=pd-attribution::(a) engine-ref — 钉的 sha **不是引擎 ${{ steps.pin.outputs.branch }} 的祖先**（钉了未合入的\"在飞\"提交）：$ref"; exit 1
          fi
          behind=$(git rev-list --count "$ref..$base")
          echo "落后引擎 main 笔数 = $behind"
          if [ "$behind" -gt 0 ]; then
            echo "::warning title=pd-stale-ref::钉的引擎 ref 落后 ${{ steps.pin.outputs.branch }} $behind 笔（不阻断：可用但陈旧；升级＝改声明件一行）"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: 装引擎依赖
        working-directory: engine
        run: npm ci

      # 字体子集化依赖：引擎自己的 4 个工作流都装了（`ci.yml:62` 等）⇒ 本仓发布**同款**。
      # 不装 ⇒ `build.mjs` 走"优雅回退"（系统字体）⇒ **发布页静默缺字体面**（实测线上少 4 段／686 B）。
      - name: 装字体子集化依赖（fonttools／brotli）
        run: pip install fonttools brotli

      - name: 编译故事（产物随故事根 ⇒ 落 books/dist；归因 (b)）
        working-directory: engine
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(b) story-face — $*"; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/books/dist"
          SG_STORIES_DIR="$GITHUB_WORKSPACE/books/stories" node build.mjs || fail "引擎编译失败（build.mjs 非零退出）"
          [ -f "$GITHUB_WORKSPACE/books/dist/index.html" ] || fail "未生成 dist/index.html（产物落点不对？）"

      # §五 冒烟**条件化**：有故事 ⇒ 缺链接必红；零故事 ⇒ **显式分叉 ＋ 软通过**（不许恒红 —— `post-deploy-smoke` 的教训）
      # §六 引擎仓**脏 0** ＋ `stories/**` 0 —— 能假：**故意不设 `SG_STORIES_DIR`** ⇒ 产物落进引擎仓 ⇒ 本步红
      - name: §五/§六 断言产物可用 ＋ 引擎仓没被写脏（归因 (b)）
        working-directory: books
        run: |
          set -euo pipefail
          # ★ 计数空集合的**安全写法**：`ls` 对空 glob 返回 2 ⇒ `2>/dev/null` 只藏报文、藏不住退出码 ⇒
          #   `set -e`＋`pipefail` 会**把通过态当失败杀掉**（books 首跑实测 exit 2）⇒ 一律 `|| true` 包住。
          storyN=$( (ls -d stories/*/ 2>/dev/null || true) | wc -l | tr -d ' ')
          echo "故事数 = $storyN"
          if [ "$storyN" -eq 0 ]; then
            echo "::notice title=pd-smoke::零故事态 ⇒ 书架页无链接属预期，**软通过**（显式分叉，非恒红）"
          else
            n=$(grep -c 'stories/' dist/index.html || true)
            echo "书架页 stories/ 链接数 = $n"
            if [ "$n" -lt 1 ]; then
              echo "::error title=pd-attribution::(b) story-face — 有 $storyN 个故事，但书架页 0 个 stories/ 链接"; exit 1
            fi
            nPages=$( (ls dist/stories/*/index.html 2>/dev/null || true) | wc -l | tr -d ' ')
            [ "$nPages" -ge 1 ] || { echo "::error title=pd-attribution::(b) story-face — 无任何故事页产物"; exit 1; }
          fi
          # §六：引擎仓必须干净（发布只读引擎仓）
          dirty=$(git -C "$GITHUB_WORKSPACE/engine" status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error title=pd-attribution::(b) story-face — 引擎仓被写脏（发布应只读）："; echo "$dirty"; exit 1
          fi
          # 同款安全写法（本行是首跑 exit 2 的真因：引擎仓 `stories/` 本来就空 ⇒ 空 glob ⇒ `ls` 退出 2）。
          inside=$( (ls -d "$GITHUB_WORKSPACE/engine/stories"/*/ 2>/dev/null || true) | wc -l | tr -d ' ')
          if [ "$inside" != "0" ]; then
            echo "::error title=pd-attribution::(b) story-face — 引擎仓里出现了 stories/<slug>（未设 SG_STORIES_DIR？）"; exit 1
          fi
          echo "✓ 引擎仓脏 0；✓ 引擎仓 stories/** 0"

          # ── 字体面（归因 (b) story-face）──
          # 引擎侧把字体当**一等交付物**（其 `ci.yml` 有「字体 404（mis-deploy）⇒ 红」）⇒ 本仓发布**同步该口径**。
          # 为什么必须显式断言：`build.mjs` 在缺 fonttools 时**优雅回退系统字体**且只 warn ⇒ 该步仍 success
          # ⇒ **发布判据看不见"线上缺字体面"**（实测：线上故事页少 `font-face`／`woff2` preload 共 4 段 ≈ 686 B）。
          nw=$( (ls dist/fonts/*.woff2 2>/dev/null || true) | wc -l | tr -d ' ')
          echo "dist/fonts/*.woff2 = $nw 个"
          if [ "$nw" -lt 2 ]; then
            echo "::error title=pd-attribution::(b) story-face — 字体产物缺失（dist/fonts/*.woff2 只有 $nw 个，应 2 个：Regular／Medium）⇒ 核 pip install fonttools brotli 与 vendor/fonts/*.ttf"
            exit 1
          fi
          # 口径：**每个**故事页都应带 font-face ⇒ 数"带该标记的页数"，缺页则红。
          # （不用 `grep -c` 求和：单文件时它不输出 `文件:数` 形态 ⇒ `awk -F:` 会恒得 0 ＝**必红假阳**）
          nf=$( (grep -l 'id="font-face"' dist/stories/*/index.html 2>/dev/null || true) | wc -l | tr -d ' ')
          nsp=$( (ls -d dist/stories/*/ 2>/dev/null || true) | wc -l | tr -d ' ')
          echo "故事页带 font-face = $nf / $nsp"
          if [ "$nf" -lt "$nsp" ]; then
            echo "::error title=pd-attribution::(b) story-face — 有故事页缺 font-face（$nf/$nsp 页带该标记）⇒ 发布出去那些页会静默用系统字体"
            exit 1
          fi
          echo "✓ 字体面在场（2 个 woff2 ＋ 故事页 font-face）"
          # 本仓不提交产物
          if git status --porcelain | grep -qE '^\?\? .*(dist/|build/)'; then
            echo "::error title=pd-attribution::(b) story-face — 有未忽略的产物（dist/build）⇒ 补 .gitignore"; exit 1
          fi
          echo "✓ 本仓无未忽略产物"

      # 归因类 (c) Pages 配置：启用失败 ⇒ 点名叫 (c)
      # ★ `sagitrs/sgstory#1592`（伞 M2）：**逐故事行为用例门已摘除**（原 `#1304` 那一步）——
      #   Operator 2026-09-28 裁定「引擎只看护引擎能力；**books 仓仅看护可编译性**」。
      #   `case-run` 的逐故事断言是**行为回归**（✗ 编译），且多数锚**逐字散文文案**（＝作者自由）
      #   ⇒ ★归属引擎（引擎仓夹具）—— 发布面**不再**用它判"能不能玩"。
      #   ★发布面**保留**：build（编译性）＋ §五/§六 产物可用（书架链接／故事页／字体面／引擎仓未脏）
      #     ＋ 发布管理（pin／Pages 配置）＋ 读数 ⇒ ★这些判的是"**发得出去**"，与本伞边界一致 ✓
      #   ★"产品坏、发布绿"这一风险的**接手方**：引擎仓的 `m3-*` 夹具族（引擎 CI 看护能力）✓
      #   ★`cases/` 目录**暂留**（迁完前留档，✗ 不删）—— 后续票按 `#1592` M2 清单收尾。
      # ── 读数（**只作读数，不作门**）──
      # 为什么只作读数：故事面一变，字节**本来就该变** ⇒ 做成硬格必然恒红。
      # 它要补的是"**字节 ↔ 输入**"这一半：钉的引擎 sha ＋ 本仓自身 sha ＋ 每故事页字节 ＋ 字体面在场数，
      # 三者同处 ⇒ 下次再遇到"线上字节 ≠ 本地构建字节"时可直接对照，不必猜。
      - name: 读数（字节 ↔ 输入；写入 step summary，不作门）
        working-directory: books
        run: |
          set -euo pipefail
          {
            echo "### 发布读数（${{ github.sha }}）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 引擎钉 ref | \`${{ steps.pin.outputs.ref }}\` |"
            echo "| 引擎声明 branch | \`${{ steps.pin.outputs.branch }}\` |"
            echo "| 本仓 sha | \`$(git rev-parse HEAD)\` |"
            echo ""
            echo "| 故事页 | 字节 |"
            echo "|---|---|"
            for f in dist/stories/*/index.html; do [ -f "$f" ] || continue; echo "| \`$f\` | $(wc -c < "$f") |"; done
            echo ""
            echo "| 字体面 | 数 |"
            echo "|---|---|"
            echo "| dist/fonts/*.woff2 | $( (ls dist/fonts/*.woff2 2>/dev/null || true) | wc -l | tr -d ' ') |"
            echo "| 故事页带 font-face | $( (grep -l 'id=\"font-face\"' dist/stories/*/index.html 2>/dev/null || true) | wc -l | tr -d ' ') |"
            echo "| 书架页字节 | $(wc -c < dist/index.html) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ 读数已写入 step summary（不作门）"

      - name: Pages 配置（§三；归因 (c)）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: books/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
