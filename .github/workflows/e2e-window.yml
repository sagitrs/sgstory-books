name: e2e-window

# 巴别产物级 e2e（`books#90` 裁定 **②「丙窗口试点」**）
#
# ★本 workflow 的**存在理由**：`#1856` 那类失效形**只有浏览器/真 DOM 层照得出**
#   （场景链的静态断言照不出 —— `books#88` MAJOR 已记），而**逐 PR** 跑无头 e2e 会
#   动**舰队零依赖基线**（books#81 丙案搁置的正是它）。⇒ 折中：**窗口式**（nightly ＋ 手动），
#   且用 **ephemeral 安装**（`npm i --no-save`）—— **仓零改动**（✗ 提交 `package.json`／lockfile）。
#
# ★两条**边界**（✗ 别误读本 job）：
#   ① 它**不是 PR 门**：失败**不阻塞**任何 PR ⇒ 新回归的**发现延迟 = 到下一次 nightly**。
#   ② 它**不替代** `babel-tests.yml`：那门跑装配自检（静态）＋单文件判据，本门跑**真 DOM 交互**。
#
# ★本 job 的**第二用途**（票面点名）：把「甲」（Playwright/Chromium）路线的**三项未测**量完 ——
#   装机时长／额度成本／**真实 CI 里的 boot 时长** ⇒ 三项都打印在 step summary，供裁甲/乙时参考。
#
# ★★**本版能力的边界**（✗ 别把「本 job 在跑」读成「`#1856` 那类已被守住」）：
#   本版冒烟走的是 boot → 点链接 → 五面板 → localStorage，**尚未跑战斗流**
#   （要跑「胜／败／僵持三终点」须先有**入口态夹具** —— 即 `#1814` **甲案**要供的东西）。
#   ⇒ **`#1856`（战斗收场无出口）那类失效形，本版抓不到**；能抓到的是**装配/面板/导航**面。
#   ⇒ **能力已备**（`clickPassage` 内建「导航确已发生」断言正是那类判据的原语），**接线候甲案**。
on:
  schedule:
    # 每日 03:17 UTC（避开整点高峰；cron 无时区，GitHub 用 UTC）
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      engine_ref:
        description: '引擎 ref（缺省 origin/main；给 40 位 sha 可对 pin 复现）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-window-${{ github.ref }}
  cancel-in-progress: false            # 窗口式 job：不取消（跑一次是一次读数）

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: books

      # ── 引擎：缺省＝**本仓声明 pin**（`books#375`）──
      # ★为何不再「缺省 main」：本门第 1 步就要断「引擎检出 == 声明 pin」（`books#198` 教训机械化）
      #   ⇒ 缺省打 main 时，**引擎 main 每前进一次、这次 nightly 必红**（实测 `#375`：声明 789762d9
      #   vs 检出 c3c6366a）⇒ 后面那些真判据（存档门禁／真 DOM 臂／战斗格三臂）**一次都没跑** ⇒
      #   门存在的理由（`#1856` 那类只有真 DOM 照得出的形）**恰好失效**。
      #   ⇒ 现形：**检出＝声明 pin**（两单对称：读 pin 单 ⇒ 检出单），本门因此验的是
      #     「**故事实际交付所依据的那棵树**」✓。
      #   ★要打新树做**早期回归**探测：显式传 `engine_ref=main`（`workflow_dispatch`）——
      #     此时第 1 步会**具名红**，那正是「你要验的树 ≠ 声明 pin」的提示 ✓（✗ 不是故障）。
      - name: 读本仓 pin（**本门的检出依据**）
        id: pin
        working-directory: books
        run: |
          set -euo pipefail
          ref=$(jq -r '.ref // empty' .github/engine-ref.json)
          # ★缺值即具名红（✗ 让空 ref 回落到检出动作的缺省分支 —— 那正是 `#375` 的病根）
          test -n "$ref" || { echo "✗ .github/engine-ref.json 缺 .ref ⇒ 本门的检出依据无法确定"; exit 2; }
          echo "本仓 pin = $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # ★本步与下一步（`check-engine-pin.mjs`）合起来才是闭环：
      #   本步判**意图**（检出单须认 pin 单）｜下一步判**结果**（检出的 HEAD 须真的等于那个 pin）。
      #   ★为何要这一步：本 workflow 原先把「缺省 main」写在检出里、把「须等于 pin」写在下一步 —
      #     两句互斥 ⇒ 引擎 main 一前进本门必红（`#375`）。本步把该不变式**机械钉住**，
      #     免得日后有人为了「打新树」把缺省又改回 main 而无人察觉。
      - name: ★引擎检出须来自声明 pin（`books#375`：两单对称）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/check-workflow-pin-ref.mjs

      - uses: actions/checkout@v4
        with:
          repository: sagitrs/sgstory
          ref: ${{ github.event.inputs.engine_ref || steps.pin.outputs.ref }}  # ★缺省＝声明 pin（`books#375`）
          path: engine
          # ★`fetch-depth: 1` 足够（本门不比对 base —— 那是行尾门的事）

      #   ★为何处处 `${GITHUB_STEP_SUMMARY:-/dev/null}`（✗ 裸 `$GITHUB_STEP_SUMMARY`）：
      #     裸引在 `set -u` 下**未定义即失败** —— 真 CI 里有值故看不出，但**仓内演练器**
      #     （`tools/rehearse-workflow.py`，同 shell flags）**不设该变量** ⇒ 本 workflow **无法演练**。
      #     本席实测即如此：4 个 step 先后红在 `unbound variable`，而**它们干的正事全部成功**
      #     （见下方「瞬时安装」的读数）⇒ 会**把「workflow 不可演练」伪装成「步骤失败」**。
      #     ⇒ 兼容写法**不损 CI**、又让本 workflow **可被演练** —— 演练正是本仓查 CI 缺陷的手段。
      - name: ★引擎检出 == 声明 pin（具名红 · `books#198` 教训机械化）
        working-directory: books
        run: |
          set -euo pipefail
          # ★门测开跑前先断这条：旧 pin ⇒ 一片红会被当产品缺陷白烧一轮（`books#198` 实例）。
          #   不一致 ⇒ rc=1 具名红；不是 git 树／缺 pin 文件 ⇒ rc=2 环境错（都✗ 不静默跳过）。
          node tools/check-engine-pin.mjs --engine "$GITHUB_WORKSPACE/engine"

      - name: ★机读基线表（形状与「未判具名」· 0.0.2 门测 ＋ **0.0.3 现役**）
        working-directory: books
        run: |
          set -euo pipefail
          # 守的是「可判性」：每行字段齐、结论取值合法、**未判必须具名**（✗ 留空＝静默跳过）。
          # ★发布口径另有 `--release`（有 `阻塞` 即红）：留到零阻塞判定那一步再上。
          node tools/check-baseline.mjs
          # ★★现役档也须核（`books#402` · 0.0.3）：★裸调用只会核**老档 0.0.2** ✗
          #   ⇒ ★若 CI 只跑上一行 ⇒ **验了旧档、却以为验了现役** ✓（本仓实况：0.0.3 是本轮验收的现役档 ✓）
          #   ★故**显式**再核一次（缺省行为**不动** ⇒ 老调用形零回归 ✓）。
          node tools/check-baseline.mjs --file docs/playtest/baseline-0.0.3.json

      - name: 核检出面（打印实际被验的树；✗ 让人以为验了 pin）
        working-directory: engine
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          pin='${{ steps.pin.outputs.ref }}'
          echo "被验引擎 HEAD = $head"
          if [ "$head" = "$pin" ]; then echo "（= 本仓 pin）"; else echo "（≠ pin $pin —— ★本门打的是**新树**，为发现回归）"; fi
          echo "### e2e-window" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "- 引擎 HEAD: \`$head\`" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "- 本仓 pin: \`$pin\`" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── ★ephemeral 安装：只在**检出出来的引擎树**里装，✗ 不碰本仓、✗ 不落 lockfile ──
      #   代价读数（本 step 同时是**甲路线的量尺**之一）：装机时长与体积打给裁用。
      - name: 瞬时安装 jsdom（✗ 仓零改动：--no-save --no-package-lock）
        working-directory: engine
        run: |
          set -euo pipefail
          # ★自证「验的是哪棵树」＋★**判**（✗ 只打印）：本 job 的核心承诺是**仓零改动**，
          #   而「打印一行数字」守不住任何东西。
          #   ★★判据形＝**前后比对**（✗ 断言「树是干净的」）—— 首版我写的是后者，**当场演练即假红**：
          #     它把「环境本来就有的未跟踪残留」算成了「本 step 写的」（我工作区里的
          #     `stories/*demo*` 等残留与我自己未提交的档都被算进去）。
          #   ⇒ 本 step 只该为**自己做过的事**负责 ⇒ 取**装前/装后快照**比对。
          t0=$(date +%s)
          books_before=$(cd "$GITHUB_WORKSPACE/books" && git status --porcelain | sort)
          npm install jsdom --no-save --no-package-lock --no-audit --no-fund 2>&1 | tail -5
          t1=$(date +%s)
          echo "装机时长 = $((t1-t0))s"
          du -sh node_modules | awk '{print "node_modules 体积:", $1}'
          node -e "console.log('jsdom', require('jsdom/package.json').version)"
          books_after=$(cd "$GITHUB_WORKSPACE/books" && git status --porcelain | sort)
          if [ "$books_before" != "$books_after" ]; then
            echo "::error title=e2e-attribution::本 step 声称只在引擎树里装，却**动了 books**"
            echo "  （装前 ${books_before:+有} ／ 装后 有 —— 差异如下；若落了 lockfile 即 --no-package-lock 失守）"
            diff <(printf '%s\n' "$books_before") <(printf '%s\n' "$books_after") || true
            exit 1
          fi
          echo "books 零改动 ✓（装前=装后）"
          { echo "- jsdom 装机时长: $((t1-t0))s"; du -sh node_modules | awk '{print "- node_modules: " $1}'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── ★真浏览器族（`e2e-280-*`）的运行时装：Chromium ＋ playwright 模块 ──
      #   ★为何要装：本 job 用 `ubuntu-latest`，运行时**没有**本族缺省路径的浏览器
      #     （`~/.cache/ms-playwright/chromium-<rev>/…`）⇒ 用 playwright 自己那条命令装**同版**
      #     （`playwright@1.63.0 ↔ chromium-1243` —— 装的路径**正是**本族缺省路径）。
      #   ★`--with-deps` 装系统库（字体/音频等）⇒ 仓内**不需要** `LD_LIBRARY_PATH`（那是本机开发形的补丁）。
      #   ★仍是 ephemeral：`npm i --no-save --no-package-lock` ＋ 下一步核 `books` 没被写脏（同 jsdom 那步的双核）。
      - name: 瞬时安装 playwright ＋ Chromium（真浏览器族运行时装）
        working-directory: books
        run: |
          set -euo pipefail
          t0=$(date +%s)
          books_before=$(git status --porcelain)
          npm install playwright@1.63.0 --no-save --no-package-lock --no-audit --no-fund 2>&1 | tail -3
          npx --yes playwright@1.63.0 install --with-deps chromium 2>&1 | tail -5
          t1=$(date +%s)
          CH="$HOME/.cache/ms-playwright/chromium-1243/chrome-linux64/chrome"
          [ -x "$CH" ] || { echo "::error title=e2e-window::Chromium 不在本族缺省路径 $CH（版本/路径须与 tools 里的缺省一致）"; ls -d "$HOME"/.cache/ms-playwright/* 2>/dev/null || true; exit 1; }
          "$CH" --version | sed 's/^/  Chromium /'
          books_after=$(git status --porcelain)
          if [ "$books_before" != "$books_after" ]; then
            echo "::error title=e2e-attribution::真浏览器时装动了 books（✗ 须 ephemeral）"
            diff <(printf '%s\n' "$books_before") <(printf '%s\n' "$books_after") || true
            exit 1
          fi
          { echo "- Chromium 装机时长: $((t1-t0))s"; "$CH" --version | sed 's/^/- /'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: 构建产物（引擎 build.py ＋ 本仓故事）
        working-directory: books
        run: |
          set -euo pipefail
          STORY="$GITHUB_WORKSPACE/books/stories/babel"
          python3 "$GITHUB_WORKSPACE/engine/build.py" "$STORY" --out babel-trial.html

      # ── 共享件：冒烟 ＋ 刀（两道都跑 —— ✗ 只跑冒烟会漏「判据是否还判得了」）──
      - name: e2e 共享件 · 刀（证明判据判得了）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/e2e-harness.mjs --engine "$GITHUB_WORKSPACE/engine" --selftest | tee /tmp/knives.out
          { echo '```'; tail -3 /tmp/knives.out; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: e2e 共享件 · 产物级冒烟（P0/P1 机械子集）
        working-directory: books
        run: |
          set -euo pipefail
          t0=$(date +%s)
          node tools/e2e-harness.mjs --engine "$GITHUB_WORKSPACE/engine" | tee /tmp/smoke.out
          t1=$(date +%s)
          # ★boot 时长由共享件自己打印（「boot Nms」）—— 那是**甲路线三项未测**之一，
          #   此处把它并成一行汇总，供裁甲/乙时直接引用。
          # ⚠ `#91` 修正后共享件的输出形由「boot(含 5 步) Nms」⇒「boot Nms」：**模式变了却不报错**
          #   就会静默退化成「未打印」（旧形 `|| true` 正是如此）⇒ 故此处**取不到即红**（✗ 不吞）。
          boot=$(grep -oE 'boot [0-9]+ms' /tmp/smoke.out | head -1 || true)
          [ -n "$boot" ] || { echo "::error title=e2e-window::共享件未打印 boot 时长（输出形恐已变 ⇒ 见 tools/e2e-harness.mjs 的打印行）"; exit 1; }
          echo "冒烟总时长 $((t1-t0))s ｜ $boot"
          { echo "- 冒烟: $((t1-t0))s ｜ $boot"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── `books#209`（F-01）：**真宿主**两半（战中宿主禁存 ＋ 读档后无残影）＋ 两把刀 ──
      #   为何单开一枝：这两件事**只在真宿主里看得见**（侧栏走 `Config.saves.isAllowed`；
      #   残影靠真 `Save.slots.load` 才能复现）—— 无头那一路（`verify.mjs` ㊴ 格）用的是照抄的桩。
      # ★与冒烟并成**一步**（`gates.md` 测试面：每 job 步数有上限）；✗ 不为此另起两步。
      - name: ★宿主存档门禁与读档面板一致性（books#209）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/e2e-209-host-save.mjs --engine "$GITHUB_WORKSPACE/engine" | tee /tmp/e209.out
          node tools/e2e-209-host-save.mjs --engine "$GITHUB_WORKSPACE/engine" --selftest | tee /tmp/e209k.out
          # ★取不到即红（✗ 不吞）：`#91` 那族的教训 —— 输出形变了却不报错，判据会**静默退化**成装饰。
          grep -q '真宿主判据通过' /tmp/e209.out || { echo "::error title=e2e-window::e2e-209 未打印「真宿主判据通过」（输出形恐已变 ⇒ 见 tools/e2e-209-host-save.mjs）"; exit 1; }
          grep -q '两把刀如期' /tmp/e209k.out || { echo "::error title=e2e-window::e2e-209 的刀未打印「两把刀如期」（自检恐已退化）"; exit 1; }
          { echo '```'; tail -3 /tmp/e209.out; echo '---'; tail -4 /tmp/e209k.out; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── `books#216`：**侧栏存档按钮的真 DOM 臂**（玩家真点得到的那颗按钮）──
      #   为何单开一步（✗ 并进上面 books#209 那步）：那条步的两句汇总串正被上面两条 `grep` 守着，
      #   混在一起会让「哪一句是谁的」说不清。★步数上限仍在（`gates.md` 测试面）⇒ 只加这一步。
      #   ★本笔**依赖 `books#224`**（工具档 `tools/e2e-216-sidebar-save-dom.mjs` 由它落盘）⇒ 合序 `#224` → 本笔。
      - name: ★侧栏存档按钮的真 DOM 臂（books#216）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/e2e-216-sidebar-save-dom.mjs --engine "$GITHUB_WORKSPACE/engine" | tee /tmp/e216.out
          node tools/e2e-216-sidebar-save-dom.mjs --engine "$GITHUB_WORKSPACE/engine" --selftest | tee /tmp/e216k.out
          # ★取不到即红（✗ 不吞）：`#91` 那族的教训 —— 输出形变了却不报错，判据会**静默退化**成装饰。
          #   ★另：`set -o pipefail` 是这两句 `| tee` **能用**的前提 —— 没有它，管道会把 `node` 的
          #     非零退出码吃掉（只剩 `tee` 的 0）⇒ 判据红了这步也不会红。
          grep -q '侧栏真 DOM 判据通过' /tmp/e216.out || { echo "::error title=e2e-window::e2e-216 未打印「侧栏真 DOM 判据通过」（输出形恐已变 ⇒ 见 tools/e2e-216-sidebar-save-dom.mjs）"; exit 1; }
          grep -q '刀的判别力自证通过' /tmp/e216k.out || { echo "::error title=e2e-window::e2e-216 的刀未打印「刀的判别力自证通过」（自检恐已退化）"; exit 1; }
          { echo '```'; tail -4 /tmp/e216.out; echo '---'; tail -3 /tmp/e216k.out; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── `sgstory#1950`：**战斗格三臂**（`quick:use` 派发：治疗经「选项→靶解析→act」真落地／防具结构化拒绝／己方致伤正控）──
      #   为何单开一步（✗ 并进上面 #209 那步）：那条步的两句汇总串正被它自己的两条 `grep` 守着，
      #   混在一起会让「哪一句是谁的」说不清（与 `#216` 同理由）。★步数上限仍在（`gates.md` 测试面）⇒ 只加这一步。
      #   ★本笔**依赖 `books#228`**（该格由它落盘）⇒ 合序 `#228` → 本笔。
      - name: ★战斗格三臂（quick:use 派发 · sgstory#1950）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/e2e-drive.mjs --engine "$GITHUB_WORKSPACE/engine" | tee /tmp/e1950.out
          node tools/e2e-drive.mjs --engine "$GITHUB_WORKSPACE/engine" --selftest | tee /tmp/e1950k.out
          # ★取不到即红（✗ 不吞）：输出形一变，判据会**静默退化**成装饰（`#91` 那族的教训）。
          #   ★另：`set -o pipefail` 是这两句 `| tee` **能用**的前提 —— 没有它，管道会把 `node` 的
          #     非零退出码吃掉（只剩 `tee` 的 0）⇒ 判据红了这步也不会红。
          grep -q '战斗格 ✓' /tmp/e1950.out || { echo "::error title=e2e-window::e2e-1950 未打印「战斗格 ✓」（输出形恐已变 ⇒ 见 tools/e2e-drive.mjs）"; exit 1; }
          grep -q '战斗格刀①' /tmp/e1950k.out || { echo "::error title=e2e-window::e2e-1950 的刀未打印（自检恐已退化 ⇒ 见 tools/e2e-drive.mjs）"; exit 1; }
          { echo '```'; tail -2 /tmp/e1950.out; echo '---'; tail -3 /tmp/e1950k.out; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── `#203`：**拒因可判**（A 轨校准链的长期化 · 领队裁 2026-10-04）──
      #   为何单开一步：跑分器是**独立工具**，其汇总串不与别的步共享；混在一起说不清「哪句是谁的」。
      #   ★取不到即红 ＋ `pipefail`（没有它，`| tee` 会吃掉 `node` 的非零退出码）。
      - name: ★拒因可判（rejected 行明细 ＋ 派发 kind · #203）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/balance-babel.mjs --engine "$GITHUB_WORKSPACE/engine" --fixture 纯攻 --samples 3 --dump-tracks | tee /tmp/e203d.out
          grep -q '★拒因可判：' /tmp/e203d.out || { echo "::error title=e2e-window::#203 未打印「★拒因可判」（汇总串丢了 ⇒ 见 tools/balance-babel.mjs）"; exit 1; }
          if grep -q '✗ 有 .* 条被拒但' /tmp/e203d.out; then
            echo "::error title=e2e-window::#203 有被拒却**没带明细** ⇒ 录过程断了"; exit 1
          fi
          { echo '```'; tail -2 /tmp/e203d.out; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── `books#233` 后续：**被拒路径激励**（领队 2026-10-04 01:46 排）──
      #   为何单开一步：`#203` 那步跑 `纯攻` ⇒ 读数 `rejected=0` ⇒ 「★明细=」／「★派发=」两栏与
      #   `M<N` 那条红**从未被真读数激励过**（判据在、样本不在）。本步用「乱用」夹具（故意点非武器件）
      #   逼出**真被拒**读数，并**强制** `rejected>0` ⇒ 那两栏有了样本。
      #   ★`M<N` 自身有牙由 `--selftest` ⑦ 证（藏一条明细 ⇒ 小结自己报账）✓。
      - name: ★拒因可判·被拒路径激励（#233 后续）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/balance-babel.mjs --engine "$GITHUB_WORKSPACE/engine" --fixture 乱用 --samples 3 --dump-tracks | tee /tmp/e233r.out
          grep -q '★拒因可判：' /tmp/e233r.out || { echo "::error title=e2e-window::#233 未打印「★拒因可判」（汇总串丢了）"; exit 1; }
          grep -Eq '★拒因可判：rejected=[1-9][0-9]* ' /tmp/e233r.out || { echo "::error title=e2e-window::#233 被拒路径**没被激励**（rejected=0）⇒ 夹具/策略失效"; exit 1; }
          grep -Eq '★拒因可判：rejected=([1-9][0-9]*) 带明细=\1$' /tmp/e233r.out || { echo "::error title=e2e-window::#233 有被拒但**明细数对不上** ⇒ 录过程断了"; exit 1; }
          { echo '```'; tail -2 /tmp/e233r.out; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # ── 归因：引擎源不得被写脏（build 产物除外）── 与 `babel-tests.yml` 同取向 ──
      - name: ★L9 承诺带守卫 · 温泉（`--enforce-target` · N=200 · #170 第 2 步）
        working-directory: books
        run: |
          set -euo pipefail
          # ★`pipelinefail` 由 pipefail 兜住：`--enforce-target` 下不在 70–85% 带内即非零退出 ⇒
          #   本步**即**红（✗ 不靠再写一条 grep 判带）✓；下面的 grep 只证「读数真跑出来了」。
          node tools/balance-babel.mjs --engine "$GITHUB_WORKSPACE/engine" --fixture "温泉→L9 头目" --samples 200 --enforce-target | tee /tmp/e170w.out
          grep -q '击败率' /tmp/e170w.out || { echo "::error title=e2e-window::#170 温泉格没打印击败率（读数没跑到 ⇒ 绿的没有根据）"; exit 1; }

      - name: ★L9 承诺带守卫 · 满装（`--enforce-target` · N=200 · #170 第 2 步）
        working-directory: books
        run: |
          set -euo pipefail
          node tools/balance-babel.mjs --engine "$GITHUB_WORKSPACE/engine" --fixture "满装→L9 头目" --samples 200 --enforce-target | tee /tmp/e170m.out
          grep -q '击败率' /tmp/e170m.out || { echo "::error title=e2e-window::#170 满装格没打印击败率（读数没跑到 ⇒ 绿的没有根据）"; exit 1; }

      - name: ★L9 对照格 · 不温泉（**印读数 ✗ 不入 enforce** · 证明豁免真生效）
        working-directory: books
        run: |
          set -euo pipefail
          # ★这一步骤故意**也**带 `--enforce-target`：它**必须** rc=0 —— 因为它已被标为「对照格」⇒
          #   ✗ 不入 enforce ✓。若哪天豁免失效（例如守卫回退），它当场 rc=1 ⇒ 本步红 ✓（✗ 不靠人记）。
          # ★★**对照格语义**（`books#249` 接线时显式写下来）：本格**只证"豁免机制真生效"** ✗ 不作产品判定 ——
          #   它的读数（不温泉 ⇒ 低于 70–85% 带）**永远不入** 0.0.2 的达标统计 ✓；反过来，本格 rc=0 **也不表示**
          #   产品达标 ✓。★读本步时：绿＝"豁免还在"，✗ 读成"平衡没问题" ✓。
          node tools/balance-babel.mjs --engine "$GITHUB_WORKSPACE/engine" --fixture "不温泉→L9 头目" --samples 200 --enforce-target | tee /tmp/e170c.out
          grep -q '⏳ 对照格：' /tmp/e170c.out || { echo "::error title=e2e-window::#170 对照格豁免没生效（读数未被标为对照 ⇒ 假红风险回来了）"; exit 1; }

      - name: ★布局壳 panels 守卫（注册⇒常驻渲染 ＋ 域刷新局部性 · #1763/#252）
        working-directory: books
        run: |
          set -euo pipefail
          # ★本步 = **回归守卫**：`#252` 正文已报实况 —— 布局壳（引擎 `src/core/72-panel.js`）＋ 故事侧 writer
          #   （`stories/babel/src/ui/panels.js`）**都已接线** ⇒ 本档现在应**绿** ⇒ ✗ 不是"面未到"的那种红 ✓。
          # ★退出码契约（`tools/e2e-1763-panels.mjs` 头注 `:24`）：**0**=三面全过；**1**=有红；**2**=**环境错**（引擎根／产物／jsdom，具名）。
          set +e
          node tools/e2e-1763-panels.mjs --engine "$GITHUB_WORKSPACE/engine" > /tmp/e1763.out 2>&1
          rc=$?
          set -e
          cat /tmp/e1763.out
          # ★**rc=2 的容忍＝零**（领队 2026-10-04 05:23 裁：「rc=2 容忍设窄 · 只认本档标记」）。
          #   ★依据是**我自己的实测**：2026-10-04 我跑本档先得 **rc=2**，原因**不是**"产品未到"，
          #   而是**故事产物陈旧**（`#221` 的新鲜度守卫拦的）⇒ 若把 rc=2 当"预期"，**陈旧产物／引擎根不对**
          #   这类**装置错**就会被吃掉、被读成"产品未到" ✗（`books#249` 的接线意见同此）。
          #   故此处**逐码名判**：2 ⇒ 具名红「装置错」，并**钉死"✗ 不是产品未到"**。
          if [ "$rc" -eq 2 ]; then
            echo "::error title=e2e-window::#1763 是**装置错**（引擎根／故事产物／jsdom）⇒ ✗ 不是\"面未到\"；先修装置，再读读数"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            if grep -q '★\*\*面未到\*\*' /tmp/e1763.out; then
              echo "::error title=e2e-window::#1763 ★**面未到** —— 布局壳／writer 接线**回退**了（**产品侧**红 ⇒ 见 `#1763` ① 与 `#252`）"
            else
              echo "::error title=e2e-window::#1763 判据红（✗ 非\"面未到\"）⇒ 读 /tmp/e1763.out 里的具名红"
            fi
            exit 1
          fi
          # 守护串：证"读数真跑到"（照 `#240` 形）——✗ 只信退出码 ✓。
          grep -q '✓ e2e-1763 三面全过' /tmp/e1763.out || { echo "::error title=e2e-window::#1763 没打印「三面全过」守护串（读数没跑到 ⇒ 绿的没有根据）"; exit 1; }
          # ★★本步**未**覆盖（`books#252` 正文同此声明；接线时落到注释里，✗ 只留在 PR 里）：
          #   `#1763` ① ＝ D11「**同段落内操作 HUD 不刷新**（捡物三次只显示一次）」⇒ **✗ 未断** ——
          #   harness 侧**没有**可 poke 的"段内状态变更"入口 ✓。本步断的是「**刷新函数的局部性**」（改了 hp ⇒ 只有 hp 计数 +1 ✓）；
          #   D11 断的是「**段内变更有没有人去调刷新**」⇒ 两者**不可互推** ⇒ ★**别把本步的绿读成"D11 已护住"** ✓。
          echo "布局壳 panels 守卫 ✓（三面全过 ＋ 守护串在；未覆盖 D11 ⇒ 见上注释）"

      # ── ★真浏览器 smoke 子集（`books#295` 池 B 首笔批 · **名单写死**）──
      #   名单：`e2e-280-kills-easy`（⑭ 主线可通关的最小真读数）｜`e2e-280-encounter-stop`（②-2 遭遇停）｜
      #         `e2e-280-save-delete`（⑫ 存档栏位可用性）｜`e2e-280-playtest`（多臂；`#374` 修好后 **10/0** ⇒ 本席判**入**）
      #   ★**✗ 不含** `e2e-280-fullrun`（整局 ~4 分钟）—— 池 B 明示「**候议**」；其具名理由写在
      #     `tools/check-tool-registry.mjs` 的**豁免表**里（那份表就是本门的对账面）。
      #   ★每支**两道都跑**：正跑 ＋ `--selftest`（刀）；并**取守护串** —— ✗ 只信退出码
      #     （输出形变了 ⇒ 判据会**静默**退化成装饰；本 workflow 已有同款教训注释）。
      - name: ★真浏览器 smoke 子集（写死四支 · 正跑＋自检）
        working-directory: books
        run: |
          set -euo pipefail
          export PW_DIR="$GITHUB_WORKSPACE/books"          # ★本族的模块解析根（其下有 node_modules/playwright）
          export CHROME_BIN="$HOME/.cache/ms-playwright/chromium-1243/chrome-linux64/chrome"
          ART="$GITHUB_WORKSPACE/books/stories/babel/babel-trial.html"
          fail=0
          run_one() {
            local f="$1" 守护="$2" rc=0
            echo "── $f"
            node "$f" --books "$PWD" --engine "$GITHUB_WORKSPACE/engine" --art "$ART" > "/tmp/out" 2>&1 || rc=$?
            tail -6 /tmp/out
            if [ "$rc" -eq 2 ]; then echo "::error title=e2e-280::$f 是**装置错**（rc=2：引擎根／产物／浏览器）⇒ ✗ 不是产品红"; fail=1; return 0; fi
            if [ "$rc" -ne 0 ]; then echo "::error title=e2e-280::$f 判据红（rc=$rc）⇒ 读 /tmp/$f.out 的具名红"; fail=1; return 0; fi
            grep -qF "$守护" "/tmp/out" || { echo "::error title=e2e-280::$f 没打印守护串「$守护」（读数没跑到 ⇒ 绿的没有根据）"; fail=1; return 0; }
            node "$f" --selftest > /tmp/knife.out 2>&1 || { echo "::error title=e2e-280::$f 自检（刀）红 ⇒ 判据恐已退化"; tail -6 /tmp/knife.out; fail=1; return 0; }
            echo "  ✓ 正跑 ＋ 自检（刀）都过"
          }
          run_one tools/e2e-280-kills-easy.mjs    '通过 2｜失败 0'
          run_one tools/e2e-280-encounter-stop.mjs '通过 4｜失败 0'
          run_one tools/e2e-280-save-delete.mjs    '通过 2｜失败 0'
          run_one tools/e2e-280-playtest.mjs       '通过 10｜失败 0'
          [ "$fail" -eq 0 ] || exit 1
          echo "真浏览器 smoke 子集 ✓（四支：正跑 ＋ 自检）"
          { echo "- 真浏览器 smoke: kills-easy／encounter-stop／save-delete／playtest（正跑＋刀）✓"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: ★B 族候实现红测（红**须具名** · 红旗 ✗ 预期 · `#416`–`#420`／`#425`）
        run: |
          set -u
          # ★口径（沿 `tests/b-series/README.md`）：本族是「**候实现红测**」⇒
          #   · **判据红＝预期** ✓（每条须具名指出「哪一面的什么事实不成立」）
          #   · **红旗＝装置/前置错** ✗（坏档／崩／零出声／早退／缺产物）—— runner 自带此判并 `exit 2` ✓
          #   ⇒ 故本步**只**用 runner 的退出码与汇总行：红旗 0 ⇒ rc 0（读数可用）✓；✗ 不得把红旗当「判据红」✓
          bash tests/b-series/run-all.sh
      - name: 引擎仓没被写脏（归因）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/engine"
          dirty=$(git status --porcelain -- src tests/unit/framework stories 2>/dev/null | wc -l)
          [ "$dirty" -eq 0 ] || { echo "::error title=e2e-attribution::引擎源被改写 $dirty 处"; git status --porcelain -- src tests/unit/framework stories; exit 1; }
          echo "引擎源零改动 ✓（build 产物与 install 的 node_modules 除外）"
