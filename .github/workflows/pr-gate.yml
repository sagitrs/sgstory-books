name: pr-gate

# `#1409`：**本仓（books）PR 门** —— 用**本仓自己的 pin** 编一遍故事 ＋ 跑用例。
#
# 为什么需要它（**实测教训**）：`pages.yml` 只在 `push: main` 跑 ⇒ pin 与作者面能力的**代差**只能在**合并后**才发现 ✗
#   实测：`1ad8340`（`#9`）与 `3f487ab`（`#11`）两次 push 到 main 后发布链**连续红**，
#   根因＝旧 pin `db2b97b5` 早于三项新格式能力（`{{入参}}` 展开／`passageSpecs` 特判／结局声明成数据）
#   ⇒ 发布页自那以后**没有更新**，而 PR 阶段一路全绿 ✗
# ⇒ 本门把"**pin 认不认识这个故事**"提前到 **PR 期**：
#   · 用 **PR 自己的 `.github/engine-ref.json` 的 ref** checkout 引擎（✗ 不用引擎 main —— 那会掩盖 pin 陈旧）
#   · 跑 `build.mjs`（编译）＋ `case-run.mjs`（用例）⇒ ✗ **不发布**、✗ 不写任何产物入仓
#
# 归因口径（与 `pages.yml` 同）：失败归 (b) story-face —— 要么故事面不合形态，要么 pin 不认它（报文会点名）。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: books

      # ── 读本仓的 pin（唯一权威＝`.github/engine-ref.json`；✗ 工作流不硬写 sha）──
      - name: 读引擎 pin（本仓声明件为唯一权威）
        id: pin
        working-directory: books
        run: |
          set -euo pipefail
          fail() { echo "::error title=pd-attribution::(a) engine-ref — $*"; exit 1; }
          [ -f .github/engine-ref.json ] || fail "声明件缺失：.github/engine-ref.json"
          ref=$(jq -r '.ref // empty' .github/engine-ref.json)
          [ -n "$ref" ] || fail "声明件里读不到 ref"
          case "$ref" in
            ????????????????????????????????????????) ;;
            *) fail "钉的 ref 不是完整 sha（40 位十六进制）：$ref" ;;
          esac
          case "$ref" in *[!0-9a-f]*) fail "钉的 ref 含非十六进制字符：$ref" ;; esac
          echo "引擎 pin = $ref（本 PR 用它编一遍）"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: sagitrs/sgstory
          ref: ${{ steps.pin.outputs.ref }}
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: 装引擎依赖
        working-directory: engine
        run: npm ci --no-audit --no-fund

      - name: 编译故事（产物随故事根 ⇒ 落 books/dist）
        working-directory: engine
        run: |
          set -euo pipefail
          SG_STORIES_DIR="$GITHUB_WORKSPACE/books/stories" node build.mjs || {
            echo "::error title=pd-attribution::(b) story-face — 引擎编译失败 ⇒ **本 PR 的 pin 编不动本仓故事**（看上面点名；常见＝pin 早于故事用到的新格式能力）"; exit 1; }

      # ★ `sagitrs/sgstory#1592`（伞 M2）：**逐故事行为用例门已摘除** ——
      #   Operator 2026-09-28 裁定「引擎只看护引擎能力；**books 仓仅看护可编译性**」；
      #   而 `case-run` 的逐故事断言是**行为回归**（✗ 编译），且大多数锚**逐字散文文案**
      #   （＝作者自由，✗ 质量门）⇒ ★该判据**归属引擎**（引擎仓夹具 `m3-*` 族）。
      #   ★本仓保留：**build（编译性）** ＋ 散文形态（P1–P5）＋ 发布管理 ✓
      #   ★引擎侧的对应承载：`sagitrs/sgstory` 的 `test/any-and-req-cases.mjs`（`any`／`req`／值门／
      #     `m3-chk-e2e` 全集）＋ `m3-*` 夹具族 ⇒ ★引擎看护自己（✗ 以本书全量故事为语料）✓
      #   ★`cases/` 目录**已删**（`sagitrs/sgstory#1597` 的 books 半 · `books#38` 同轮）：★M2 之后**零 CI 消费**（行为验收已迁引擎夹具）⇒ 按「非必要不保留」删尽 ⇒ ★**git 历史即归档** ✓

      #   ★`books#56`（伞 M3）：本步已**拆两段**（散文门留 ／ 可达性降提示 —— 见下两步）✓
      - name: 故事面判据 · 散文词汇门（P1–P5 ＋ P6）
        working-directory: engine
        run: |
          set -euo pipefail
          # ★本段**复用引擎侧既有判据**（✗ 不在本仓重写：单一权威 ✓）
          #   `test/prose-vocabulary.mjs` ⇒ 散文词汇面 **P1–P5 ＋ P6**（**P4 ＝ 无悬空 ＋ 必填实参**）
          #   ★为什么必须在 PR 期跑：`m3-min-new` 曾有一条 P4（`门厅.敲门` 无 `args` 而目标段 `条子` 必填）
          #     ⇒ 读者走到「暗间」时 `{{条子}}` 取不到值 ✗ —— 那之前**只有人跑真门才会发现** ✓
          export SG_STORIES_DIR="$GITHUB_WORKSPACE/books/stories"
          node test/prose-vocabulary.mjs || {
            echo "::error title=pd-attribution::(b) story-face — 散文词汇门未过（P1–P5）"; exit 1; }

      # ── 可达性（`books#56` · M3）：★**只承载"未达段落" ⇒ 降为提示（✗ 阻断）** ─────────────
      #   ★为什么降：**作者草稿自由** —— 写到一半的故事本就可达性不全，它会挡住"上传＝**可编译**即可"的回路 ✗
      #   ★"**悬空链接目标**"**仍是门**（口径＝`#1592` M3"悬空留门"✓），由**两处已有**阻断承担：
      #     ① 上一步**编译故事**（引擎 `danglingProblems` ⇒ 解不开的 `[[…]]` 直接 build 失败 ✓）
      #     ② 上一步**散文门 P4**（`links[].to` 不在键集 ⇒ 点名 to ＋ 来源段 ✓）
      #     ⇒ ★故本段**不重复实现**那条"目标存在性"判据（✗ 在 workflow 里再写一份＝两份判据必漂移 ✗）
      #   ★机制仍取引擎（`unreachablePassages` 纯函数 ✓）；★**策略**（这个故事该不该全可达）归本仓 ✓
      #   ★口径：出边并集 ＝ `passages.json` 的 `links[].to` ＋ 规则行 `[[label|to]]`
      #     —— 只算一处会**误报**（实测：改制后 `north-room` 只算 `links[]` 会误报 4 段 ✗）
      #   ★两段**独立 rc 可分**：散文门红时本段不受影响，反之亦然 ✓
      - name: 故事面判据 · 可达性（未达＝**提示**；✗ 阻断）
        working-directory: engine
        run: |
          set -euo pipefail
          export SG_STORIES_DIR="$GITHUB_WORKSPACE/books/stories"
          node --input-type=module -e '
            import { unreachablePassages } from "./editor/lib/core/passages-links.mjs";
            import { readFileSync, readdirSync, existsSync } from "node:fs";
            const base = process.env.SG_STORIES_DIR;
            let n = 0;
            for (const slug of readdirSync(base)) {
              const d0 = base + "/" + slug + "/data/passages.json";
              if (!existsSync(d0)) { console.log("  " + slug + " ⇒ 旧形态（无 passages.json）⇒ 不判 ✓"); continue; }
              const data = JSON.parse(readFileSync(d0, "utf8"));
              const entry = JSON.parse(readFileSync(base + "/" + slug + "/00-story.json", "utf8")).entry;
              const rp = base + "/" + slug + "/data/rules.json";
              const rules = existsSync(rp) ? JSON.parse(readFileSync(rp, "utf8")) : null;
              const probs = unreachablePassages({ data, entry, rules });
              for (const p of probs) { console.log("::warning title=pd-reachability::(b) story-face — " + slug + "：" + p); n++; }
              if (!probs.length) console.log("  " + slug + " ⇒ 全可达 ✓");
            }
            console.log(n
              ? ("⚠ 未达段落 " + n + " 个 ⇒ **提示**（✗ 阻断；`sagitrs/sgstory-books#56` M3：作者草稿自由）")
              : "✓ 可达性全清（无未达段落）");
          '

      # ── 乙类浏览器档（**故事侧**）**已整段摘除**（`sagitrs/sgstory#1597` 的 books 半 · 操作者裁「非必要不保留」）──
      #   ★摘了哪些步：装 playwright／playwright 缓存／装 chromium／链接 CHROME_PATH／**浏览器面断言（乙类：真机 · 故事侧）** ✓
      #   ★为什么摘：★这五步的**对象是"故事"**（`BROWSER_TIERS=story` ＋ `SG_STORIES_DIR=books/stories`）⇒
      #     ★那属**看护故事**（内容侧），而 Operator 裁定「**引擎只看护引擎能力；books 仓仅看护可编译性**」✗ ✓
      #   ★引擎浏览器能力**另有直接看护**（✗ 不缺）：引擎 `realmachine` job 的 `BROWSER_TIERS=engine` 档
      #     （对象＝`m3-nocar-fixture` ⇒ `BROWSER_ASSERTIONS 33/33` ✓）⇒ ★"能力面"有主 ✓
      #   ★顺带闭掉 `sagitrs/sgstory-books#38`：本步**曾"零断言却印通过"**（books 未装 fonttools ⇒ `build.mjs` 优雅回退
      #     ⇒ 页面无 `#font-face` ⇒ `browser.mjs` 就绪守卫 bail ⇒ 打印"跳过" ⇒ step 绿 ✗）⇒ ★删掉本步＝**该洞无宿主** ✓

      - name: 断言引擎仓没被写脏（✗ 产物应落 books/dist）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/engine"
          bad=$(git status --porcelain | grep -E '^\?\? (dist|build)/' || true)
          if [ -n "$bad" ]; then
            echo "::error title=pd-attribution::(b) story-face — 引擎仓里出现了产物（未设 SG_STORIES_DIR？）：$bad"; exit 1
          fi
          echo "✓ 引擎仓干净（产物随故事根 ⇒ books/dist √）"
