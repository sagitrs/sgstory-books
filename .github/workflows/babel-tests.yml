name: babel-tests

# 巴别井 · 试玩版（`books#76` 相 A）—— 故事在**本仓**，引擎按 **pin 检出**：
# ★**本 job 的仓在 `books/`**（CI checkout 把本仓放在 `books/` 子路径下 ✓）⇒ 每一步凡要跑仓内脚本／读仓内档的，**都要带 `working-directory: books`** ✗ 漏了就会在错误的工作目录里跑（`#304` 实测：新两步漏了它 ⇒ 本票 CI 红 ✓，而**本地从仓根跑是绿的** ✗ ⇒ ★**workflow 面的刀必须在 CI 验**，本地绿不算 ✓）。
#   编译（引擎 `build.py` ＋ 本仓故事 ⇒ **单文件**）＋ **装配自检**（`stories/babel/verify.mjs`，随故事走）。
#
# 归因口径（与 `pr-gate`／`pages` 同）：① 读本仓声明件 `.github/engine-ref.json` 的 ref 检出引擎
#   （✗ **不用引擎 main** —— 那会掩盖 pin 陈旧；本门的存在意义正是让「引擎漂移打红故事测试」**显式化**，
#   与 `#1823` 的棘轮同理）；② 失败报文点名，让人一眼看出是「故事面」还是「pin 不认它」。
#
# 与 `pr-gate` 的分工：那门跑**引擎的 `build.mjs`**（book 格式的其余故事）；本门跑**巴别专用的
#   `build.py`**（SugarCube 单文件）＋ 巴别自己的装配自检。两者互不替代。
on:
  pull_request:
    paths:
      - 'stories/babel/**'
      - 'tests/scenario/**'      # ★#1814 末件：场景链住这里 ⇒ 只改它也必须触发（✗ 漏则「改了不跑」）
      # ★`books#295` 装置缺口（tester-3 核出）：门档住在这里 —— 而**只改门档**的笔此前**不触发 CI**
      #   ⇒ 「门跑在 CI 里、却测不到门」：改坏一门（或改完忘了自检）CI 一句话都不说。
      #   触发面要含它：`tests/gates/**`（本 workflow 跑的正是 `tests/gates/*.mjs`）。
      - 'tests/gates/**'
      # ★`books#295` 同族（`#300` 先例）：gate-001 电池（判据件＋随跑快照）＝「门跑在 CI 里、却测不到门」
      #   ⇒ 改它必须触发。★两份清单都补（只补一份 = 改了不跑）。
      - 'tests/gate-001/**'
      - 'tools/**'               # ★演练器（rehearse-workflow.py）改动同样须触发
      - '.github/engine-ref.json'
      - '.github/workflows/babel-tests.yml'
      # ★引用核工具本身入触发面（`#1842`）：改工具而不跑 CI ⇒ 工具的回归无人看
      - 'tools/check-refs*'
  push:
    branches: [main]
    paths:
      - 'stories/babel/**'
      - 'tests/scenario/**'      # ★#1814 末件：场景链住这里 ⇒ 只改它也必须触发（✗ 漏则「改了不跑」）
      # ★`books#295` 装置缺口（tester-3 核出）：门档住在这里 —— 而**只改门档**的笔此前**不触发 CI**
      #   ⇒ 「门跑在 CI 里、却测不到门」：改坏一门（或改完忘了自检）CI 一句话都不说。
      #   触发面要含它：`tests/gates/**`（本 workflow 跑的正是 `tests/gates/*.mjs`）。
      - 'tests/gates/**'
      # ★`books#295` 同族（`#300` 先例）：gate-001 电池（判据件＋随跑快照）＝「门跑在 CI 里、却测不到门」
      #   ⇒ 改它必须触发。★两份清单都补（只补一份 = 改了不跑）。
      - 'tests/gate-001/**'
      - 'tools/**'               # ★演练器（rehearse-workflow.py）改动同样须触发
      - '.github/engine-ref.json'
      - '.github/workflows/babel-tests.yml'
      - 'tools/check-refs*'

permissions:
  contents: read

concurrency:
  group: babel-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  babel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: books

      # ── 读本仓的 pin（唯一权威＝`.github/engine-ref.json`；✗ 工作流不硬写 sha）──
      - name: 读引擎 pin（本仓声明件为唯一权威）
        id: pin
        working-directory: books
        run: |
          set -euo pipefail
          fail() { echo "::error title=babel-attribution::(a) engine-ref — $*"; exit 1; }
          [ -f .github/engine-ref.json ] || fail "声明件缺失：.github/engine-ref.json"
          ref=$(jq -r '.ref // empty' .github/engine-ref.json)
          [ -n "$ref" ] || fail "声明件里读不到 ref"
          case "$ref" in
            ????????????????????????????????????????) ;;
            *) fail "钉的 ref 不是完整 sha（40 位十六进制）：$ref" ;;
          esac
          case "$ref" in *[!0-9a-f]*) fail "钉的 ref 含非十六进制字符：$ref" ;; esac
          echo "引擎 pin = $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # ★`#1879` D9：版本徽标取值**一处定义**（job 级＝写 `$GITHUB_ENV` ⇒ 后续各步皆可见）。
          #   ✗ 各步自算：`--version` 加参只改一处 ⇒ 「★构建可复现」步不带参重建 ⇒ sha1 异 ⇒ 误报「构建不确定」。
          echo "VER=v0.0.1·$(cut -c1-8 <<<"$ref")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: sagitrs/sgstory
          ref: ${{ steps.pin.outputs.ref }}
          path: engine

      # ★检出**自证**：`actions/checkout` 的 `ref` 若打错／上游 ref 变动，光看 step 是绿的 ⇒
      #   这里直接比 `HEAD` 与声明件里的 `.ref`（✗ 让「检出」与「钉」的**不一致**溜进后续步骤）。
      - name: 核检出 == pin（自证）
        working-directory: engine
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          want=$(jq -r '.ref' "$GITHUB_WORKSPACE/books/.github/engine-ref.json")
          [ "$head" = "$want" ] || {
            echo "::error title=babel-attribution::(a) engine-ref — 检出的引擎 HEAD($head) ≠ 声明件 ref($want)"; exit 1; }
          echo "检出 == pin ✓（$head）"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 引擎侧另需 node（`verify.mjs` 跑在 node 上；`build.py` 本身零依赖纯标准库）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建（引擎 build.py ＋ 本仓故事 ⇒ 单文件；归因 (b)）
        working-directory: books
        run: |
          set -euo pipefail
          # ★故事目录必须给**绝对路径**：`build.py` 对相对路径会先拼到**引擎仓根**（`ROOT / story_dir`）
          #   ⇒ 相对形会把引擎仓里的同名故事编掉（实测踩过：产物落在 engine/stories/babel 而非本仓）。
          STORY="$GITHUB_WORKSPACE/books/stories/babel"
          # ★`#1879` D9：版本徽标 —— `$VER` 由**第一步**写入 job 级 env（`$GITHUB_ENV`，源头＝本仓声明的 pin），
          #   本步与「★构建可复现」步**共用同一值** ✓（一处定义两处用 ⇒ 防同族复发：加参只改一处）。
          python3 "$GITHUB_WORKSPACE/engine/build.py" "$STORY" --out babel-trial.html --version "$VER" || {
            echo "::error title=babel-attribution::(b) story-face — 构建失败 ⇒ **本 PR 的 pin 编不动这个故事**"
            # ⚠ 报文里✗写反引号（`books#136` 的**同类清理**，`dev-9` 的 NIT 1）：本行是双引号字面量 ⇒
            #   `` `路径` `` 会被 shell **命令替换**吃掉，报文变成「先升  的 ref 再重跑」，
            #   并多跑一条 `<路径>: Permission denied`（演练实测）——故直写路径。
            echo "  （常见＝pin 早于故事用到的新能力：先升 .github/engine-ref.json 的 ref 再重跑）"; exit 1; }
          # 单文件判据：✗ 外部依赖（`src`/`href` 指向外部资源）；`href="#"` 这类站内锚不算
          # ⚠ `grep` **无匹配时退出码 1** ＋ 本步 `set -o pipefail` ⇒ 管道判红（首跑实测踩到：产物明明合法却被判「不是单文件」）
          #   ⇒ 必须 `|| true` 把「0 条外部依赖」这唯一的**好事**与「grep 失败」分开（✗ 用 `$?` 猜）。
          n=$({ grep -oE '(src|href)="(https?:|//|[^#][^"]*\.(js|css|png|jpg|svg))"' "$STORY/babel-trial.html" || true; } | wc -l)
          [ "$n" -eq 0 ] || { echo "::error title=babel-attribution::(b) story-face — 产物有外部依赖 $n 条 ⇒ 不是单文件"; exit 1; }
          echo "产物：$(du -h "$STORY/babel-trial.html" | cut -f1)（外部依赖 0 条 ✓）"
          # ★`#1879` D9（本席教训的机械固化）：构建后**断**「注入串在产物里**恰 1 次**」——
          #   ✗ 只断 rc：`--version` 若被**静默忽略**（引擎 `build.py` 落后旧 pin ⇒ 不认该参数）⇒ rc 仍 0 而版本行缺 ✗（本席亲历 ✗）。
          #   ⚠ 报文里✗写反引号（`books#136` 顺带修，演练实测）：本行是双引号字面量 ⇒ `` `--version` `` 会被 shell **命令替换**掉
          #     ⇒ 断言真触发时报文被吃（「查引擎 pin 是否已升（ 是否被静默忽略）」）、并多跑一条 `--version: command not found`。
          got=$(grep -c -F "buildVersion to \"$VER\"" "$STORY/babel-trial.html" || true)
          if [ "$got" != "1" ]; then
            echo "::error title=babel-attribution::(b) D9 注入串在产物里命中 $got 次（须恰 1）—— 查引擎 pin 是否已升（--version 是否被静默忽略）"; exit 1
          fi


      - name: ★构建可复现（同 pin 同故事 ⇒ 逐字节相同）
        working-directory: books
        run: |
          set -euo pipefail
          STORY="$GITHUB_WORKSPACE/books/stories/babel"
          cp "$STORY/babel-trial.html" /tmp/first.html
          # ★同参重建：`--version "$VER"` 与首建**逐字相同**（漏参 ⇒ sha1 异 ⇒ 误报「构建不确定」；`#1879` 亲历）
          python3 "$GITHUB_WORKSPACE/engine/build.py" "$STORY" --out babel-trial.html --version "$VER" >/dev/null
          a=$(sha1sum /tmp/first.html | cut -d' ' -f1)
          b=$(sha1sum "$STORY/babel-trial.html" | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "::error title=babel-attribution::(b) story-face — 两次构建产物不同（sha1 $a vs $b）⇒ 构建不确定"; exit 1; }
          echo "两次构建 sha1 相同 ✓（$a）"

      # ── 场景链（`#1814`：单源清单喂两层）──
      #   `tests/scenario/run.mjs` 已落本仓 ⇒ **本步已是真断言**（✗ 不再是预留接线点）。
      #   ★它内部**第 0 步先跑 `validate.mjs`**（清单不合形 ⇒ 场景链不开跑）。
      #   ★引擎单测 bundle：`build.py` 的 `main()` **总会**调 `build_unit_bundle()`
      #     （`python3 build.py <故事> --out …` 亦然）⇒ **上面的构建步已产出**
      #     `engine/tests/unit/dist/bundle.js` ⇒ 本步**无需**再加一次构建
      #     （本席原拟加一步，读 `build.py:239` 后判定**冗余**，故不加）。
      #   ⚠ 本步的读数含**未机械判明账**（语义断言是散文）—— 见运行输出，✗ 别把「通过」读成「语义已验」。
      - name: 场景链（单源清单喂两层；★真断言）
        working-directory: books
        run: |
          set -euo pipefail
          node tests/scenario/run.mjs --engine "$GITHUB_WORKSPACE/engine"

      # ── 清单引用核（乙步；`#80` tester-4 裁乙）：K13 只查引用**有形**，本步查其**内容** ——
      #    文件存在／行号在范围内／声明了符号的引用须逐字含之／散文形一律红。
      # ★`books#271` 余项（领队 2026-10-04 裁 · **T 批面**）：本步带 `--require-symbols`。
      #   此前「仅范围核 N」只是**明账**（N>0 也 rc=0）⇒ 作者忘了写符号**不回红**
      #   （实测：只拆掉一处已声明的符号 ⇒ 不符 0／rc 0，而明账变 1）。清单已刷到 N=0
      #   （`#289`）⇒ 从此这条明账是**机械判据**：任何无符引用会让本步具名红。
      - name: 清单引用核（行号须含所声明的符号；★明账即判据）
        working-directory: books
        run: node tools/check-refs.mjs --engine "$GITHUB_WORKSPACE/engine" --require-symbols

      - name: 内容边界登记表（#1988 切片① · 新档未登记 ⇒ 红）
        working-directory: books
        run: node tools/check-content-inventory.mjs
      - name: 内容边界登记表 · 自检
        working-directory: books
        run: node tools/check-content-inventory.mjs --selftest

      # ★门必须**红得了**（同「恒绿门自证」的体例）：往**临时**清单里塞一处无符引用，
      #   断言本门确实 rc≠0 且具名到那一处 ⇒ 证明上面的开关**没被写成装饰**；随后按字节复原。
      - name: ★引用核门自证（注入无符引用 ⇒ 须 rc≠0 且具名）
        working-directory: books
        run: |
          set -euo pipefail
          cp stories/babel/scenarios/scenarios.json /tmp/scen.bak
          python3 - <<'PY'
          import json
          p = 'stories/babel/scenarios/scenarios.json'
          d = json.load(open(p, encoding='utf-8'))
          d['场景'][0]['备注'] += '　`src/core/70-ui.js:69`'   # 无显式符号（行号有效、内容非空）
          json.dump(d, open(p, 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          if node tools/check-refs.mjs --engine "$GITHUB_WORKSPACE/engine" --require-symbols > /tmp/refs.out 2>&1; then
            cp /tmp/scen.bak stories/babel/scenarios/scenarios.json
            echo "✗ 注入无符引用后本门仍绿 ⇒ --require-symbols 没生效（门是装饰）"; cat /tmp/refs.out; exit 1
          fi
          cp /tmp/scen.bak stories/babel/scenarios/scenarios.json
          grep -qF "src/core/70-ui.js:69" /tmp/refs.out || { echo "✗ 红了但没具名到注入那一处"; cat /tmp/refs.out; exit 1; }
          echo "✓ 门红得了且具名（--require-symbols 生效）；清单已复原"
          git diff --quiet -- stories/babel/scenarios/scenarios.json || { echo "✗ 清单未复原（✗ 留脏）"; exit 1; }

      # ── 步骤键形门（`sgstory#1994` 的教训机械化；`sgstory-books#263` 同族：本仓 workflows 的**结构**也得有门）──
      #   ★为何是**本仓副本**而不是调引擎那份：本仓 CI 的引擎树停在声明 pin，而该门引入于 pin **之后**
      #     （引入提交 `d167d679`）⇒ 引擎树里此刻没有它。取舍与同步要求写在 `tests/gates/workflow-steps.mjs` 档头。
      # ── 故事清单 `packs` 的声明面门（`#295` 甲的**消费侧**；★T 批面）──
      #  判：清单合法 ＋ 声明的包在引擎检出里真有（✗ 拼错提前到门里红）＋ **能力门**：引擎 build.py 有 `packs` 口时
      #  真构建并断「产物里没有未声明的规则包」；引擎 pin 还没有该口时**明确印「待判」**（✗ 不算绿 ⇒ 抬 pin 后自动生效）。
      - name: 故事清单 packs 声明面门（清单合法 · 包 id 真存在 · ★能力门：产物只装已声明包）
        working-directory: books
        run: node tests/gates/pack-manifest.mjs --engine "$GITHUB_WORKSPACE/engine"

      - name: ★packs 声明面门自检（清单塞不存在 id ⇒ 须 rc=1 具名；复原逐字节同）
        working-directory: books
        run: node tests/gates/pack-manifest.mjs --engine "$GITHUB_WORKSPACE/engine" --selftest

      - name: 步骤键形门（每步须有 run/uses · 块内 run 不重复 · workflow 须有 name）
        working-directory: books
        run: node tests/gates/workflow-steps.mjs

      - name: ★步骤键形门自检（K0/K4 绿 · K1/K2/K3 红 · K5 装置错 rc=2）
        working-directory: books
        run: node tests/gates/workflow-steps.selftest.mjs

      - name: 装配自检（verify.mjs 随故事走，引擎在别处 ⇒ `--engine`）
        working-directory: books
        run: node stories/babel/verify.mjs --engine "$GITHUB_WORKSPACE/engine"

      # ★**恒绿门自证**（`#1815` 的教训随迁）：证明这道门**失败得了** ——
      #   把正常出口的汇总调用注释掉，脚本必须 rc≠0 且打出「恒绿门」具名红（✗ 静默全绿）。
      - name: ★恒绿门自证（门必须红得了）
        working-directory: books
        run: |
          set -euo pipefail
          cp stories/babel/verify.mjs /tmp/verify.bak
          perl -0pi -e 's/\nprintSummary\(\);/\n\/\/ printSummary();/' stories/babel/verify.mjs
          if node stories/babel/verify.mjs --engine "$GITHUB_WORKSPACE/engine" >/tmp/hg.out 2>&1; then
            echo "::error title=babel-attribution::(c) gate-self — 恒绿门自证失败：把出口注释掉它**仍然绿**"
            cat /tmp/hg.out; exit 1
          fi
          grep -q '恒绿门' /tmp/hg.out || {
            echo "::error title=babel-attribution::(c) gate-self — 门红了，但**不是**恒绿门那条（说明红了别的原因）"
            cat /tmp/hg.out; exit 1; }
          cp /tmp/verify.bak stories/babel/verify.mjs
          echo "恒绿门自证 ✓（出口被删 ⇒ rc≠0 且具名）"

      - name: 引擎仓没被写脏（归因 (b)）
        run: |
          set -euo pipefail
          # `build.py` 会在引擎侧生成 `tests/unit/dist/**`（构建产物）⇒ 那是**预期**的；
          # 这里只断言「引擎的**源**没被改写」（✗ 以 build 产物为脏）。
          cd "$GITHUB_WORKSPACE/engine"
          dirty=$(git status --porcelain -- src tests/unit/framework stories 2>/dev/null | wc -l)
          [ "$dirty" -eq 0 ] || { echo "::error title=babel-attribution::(b) story-face — 引擎源被改写 $dirty 处"; git status --porcelain -- src tests/unit/framework stories; exit 1; }
          echo "引擎源零改动 ✓（build 产物除外：ngbuild 产物在 tests/unit/dist/）"
