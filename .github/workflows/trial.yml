name: trial-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/trial.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sgstory (public)
        uses: actions/checkout@v4
        with:
          repository: sagitrs/sgstory
          ref: main
      - name: Build trial (single file, no deps)
        run: python3 build.py stories/babel --out babel-trial.html
      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp stories/babel/babel-trial.html site/index.html
          printf '<!doctype html><meta charset="utf-8"><title>巴别之井</title><meta http-equiv="refresh" content="0; url=index.html">' > site/play.html
          cp stories/babel/babel-trial.html site/play.html
          printf '# 巴别之井 · 试玩版\n\n- 直接玩: [play.html](play.html)\n- 源仓库: sagitrs/sgstory@main（本站随其自动重建）\n' > site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
